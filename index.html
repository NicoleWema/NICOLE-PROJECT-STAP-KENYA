<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAP-Kenya | Welcome</title>
    <style>
        /* Modern Plain CSS Variables & Reset */
        :root {
            --primary-green: #09b43a;
            --dark-green: #006222;
            --bg-dark: #0d1117;
            --bg-card: #151b23;
            --border-color: #3d444d;
            --text-light: #f0f6fc;
            --text-muted: #b7bdc8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Layout */
        .auth-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* App Branding Header */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header h1 {
            font-size: 2rem;
            color: var(--primary-green);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Tab Toggles */
        .tab-group {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: var(--primary-green);
            border-bottom: 2px solid var(--primary-green);
            margin-bottom: -2px;
        }

        /* Form Structure */
        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-light);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--dark-green);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Branding -->
        <div class="brand-header">
            <h1>STAP–Kenya</h1>
            <p>Smart Tourism Application Platform</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="tab-group">
            <button class="tab active" onclick="switchTab('login')">Log In</button>
            <button class="tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active" onsubmit="handleAuth(event, 'login')">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Access Platform</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signup-form" class="auth-form" onsubmit="handleAuth(event, 'signup')">
            <div class="form-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" required placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="signup-role">Account Type</label>
                <select id="signup-role" required>
                    <option value="tourist">International / Local Tourist</option>
                    <option value="guide">Local Tour Guide / Operator</option>
                    <option value="conservationist">Conservation Officer</option>
                    <option value="admin">Tourism Management / Stakeholder</option>
                </select>
            </div>
            <div class="form-group">
                <label for="signup-password">Create Password</label>
                <input type="password" id="signup-password" required placeholder="Minimum 8 characters">
            </div>
            <button type="submit" class="btn-submit">Create Smart Account</button>
        </form>
    </div>

    <script>
        // Tab switching logic
        function switchTab(tabName) {
            // Remove active classes
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));

            // Add active classes to selected elements
            if (tabName === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }

        // Placeholder handler for hackathon presentation / routing
        function handleAuth(event, type) {
            event.preventDefault();
            alert(type === 'login' ? 'Logging into STAP platform...' : 'Account created successfully!');
            // Here you can use window.location.href = 'dashboard.html' to redirect after submission
        }
    </script>
</body>
</html>
